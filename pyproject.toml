[project]
name = "ledgerline"
version = "0.1.0"
description = "Exactly-once payments service with a double-entry ledger: from-scratch idempotency, transactional outbox, and reconciliation."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# FastAPI's dependency injection uses Depends()/Header() calls in argument
# defaults by design; B008 is the documented exception for it.
extend-ignore = ["B008"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
