# Postgres for the Stage 1.5+ concurrency demo (real row locking).
# Stage 1 runs on SQLite with zero infra; bring this up when we port over.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ledgerline
      POSTGRES_PASSWORD: ledgerline
      POSTGRES_DB: ledgerline
    ports:
      # host 5433 -> container 5432, to avoid clashing with a local Postgres on 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
